}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

button,input,select{font:inherit;color:inherit}
input,select{font-size:16px}   /* iPhone не увеличивает страницу при вводе */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:max(12px,env(safe-area-inset-top)) 0 12px;border-bottom:1px solid var(--border);margin-bottom:14px}

.btn-main{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.box{max-width:420px;margin:8vh auto 0;padding:24px}
.box h1{font-size:18px;margin:0 0 6px;color:var(--head)}
.box p{margin:0 0 14px;color:var(--text-dim)}
.box input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);margin-bottom:10px}

.hide{display:none!important}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 16px;cursor:pointer}
.tab.on{background:var(--surface-2);border-color:var(--border-strong);font-weight:600;color:var(--head)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input,.bar select{padding:8px 10px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);min-width:0}
.bar input{flex:1 1 240px}
.bar select{flex:0 1 260px}
.cnt{color:var(--text-help);font-size:13px}
.tw{overflow-x:auto}

th,td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--text-help);font-weight:600;background:var(--surface-2)}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.a{font-family:ui-monospace,Consolas,monospace;white-space:nowrap}
td .z{color:var(--text-help)}
tr.tot td{font-weight:700;background:var(--surface-2)}
tbody tr:hover td{background:var(--row-hover)}

.wb{margin-bottom:8px;overflow:hidden}
.wb-top{display:flex;align-items:center}
.wb-top>.cbtn{margin-left:12px}
.wb.c1 .wb-top{background:var(--mk1)} .wb.c2 .wb-top{background:var(--mk2)} .wb.c3 .wb-top{background:var(--mk3)} .wb.c4 .wb-top{background:var(--mk4)} .wb.c5 .wb-top{background:var(--mk5)}
.wb-h{flex:1 1 auto;min-width:0;display:grid;grid-template-columns:18px 130px 80px minmax(130px,1.5fr) minmax(130px,1.5fr) minmax(190px,1.9fr) 100px 130px;gap:8px;align-items:center;
  width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;cursor:pointer}
.wb-h:hover{background:var(--row-hover)}
.wb-h>.x-cust,.wb-h>.x-proj,.wb-h>.x-doc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb-cap{font-size:12px;color:var(--text-help);font-weight:600;border:1px solid transparent}
.wb-cap>.cbtn{visibility:hidden}
.wb-cap>.wb-h{cursor:default;padding-top:0;padding-bottom:4px}
.wb-cap>.wb-h:hover{background:transparent}

.grp .gdoc{font-weight:400;color:var(--text-dim);margin-left:8px}

.wb-num{font-weight:600;color:var(--head)}

.wb-sum{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;border:1px solid var(--soft-border);background:var(--soft);color:var(--soft-text);margin-left:6px}
.tag.ret{background:var(--alert);color:var(--alert-text);border-color:var(--alert-border)}

.wb-b{padding:0 12px 12px;border-top:1px solid var(--border)}
/* Примечание бухгалтерии к накладной — строкой под шапкой, видно и у свёрнутой; щелчок — правка на месте */
.wb-note{display:flex;gap:6px;align-items:center;min-height:30px;padding:2px 12px 6px 176px;font-size:13px;color:var(--text-dim);cursor:text}
.wb-note>.nt{min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wb-note>.nt.ph{color:var(--text-help)}
.wb-note>.nl{flex:0 0 auto;color:var(--text-help)}

.wb-b table{margin-top:8px}
@media (max-width:900px){
  .wb-top{flex-wrap:wrap}
  .wb-top>.wb-who{order:-1;flex:1 0 100%;width:auto;margin:8px 12px 0}
  .wb-top>.wb-who.none{display:none}
  .wb-cap{display:none}
  .wb-h{grid-template-columns:18px 1fr auto;row-gap:2px}

@media (max-width:1200px){
  /* склад и позиции накладной — карточками, без прокрутки вбок */

  table.cards,table.cards tbody,table.cards tr,table.cards td{display:block;width:100%}
  table.cards tr{border:1px solid var(--border);border-radius:12px;background:var(--surface);margin-bottom:8px;padding:6px 0}

  table.cards td::before{content:attr(data-h);color:var(--text-help);text-align:left;flex:0 0 auto;max-width:50%}
  table.cards td.e{display:none}
  table.cards td.a{font-size:15px;font-weight:700;color:var(--head);flex-wrap:wrap}
  table.cards td.who-c{width:auto;min-width:0;max-width:none;padding:3px 12px 0;justify-content:flex-start}
  table.cards td.who-c::before{display:none}
  table.cards td.pj{max-width:none;white-space:normal}
  table.cards tr.tot{background:var(--surface-2)}
  tbody tr:hover td{background:transparent}
  table.cards td.sel{justify-content:flex-start}
  table.cards tr.grp td{justify-content:flex-start;gap:6px}
  table.cards tr.grp .gh{flex-wrap:wrap;row-gap:2px}
  table.cards tr.grp .gnote{flex:1 0 100%}
}

/* Метки авторов цвета: белая пилюля, кружок цвета автора и имя; на карточках — строкой над артикулом */
.ptags{display:inline-flex;flex-wrap:nowrap;gap:3px;align-items:center;vertical-align:middle}

  padding:0 5px 0 3px;font:11px/18px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-weight:500;white-space:nowrap}

.pdot.d1{background:var(--dot1)} .pdot.d2{background:var(--dot2)} .pdot.d3{background:var(--dot3)} .pdot.d4{background:var(--dot4)} .pdot.d5{background:var(--dot5)}
.pmore{font-size:11px;color:var(--text-dim);white-space:nowrap}
/* Колонка «Кто» — постоянная ширина под две метки и «+N»: артикул справа от неё всегда на одном месте */
th.who-c,td.who-c{width:108px;min-width:108px;max-width:108px;white-space:nowrap;overflow:hidden;padding-left:6px;padding-right:4px}

.wb-who{flex:0 0 96px;width:96px;margin-left:8px;overflow:hidden;white-space:nowrap}
.pal-oth{font-size:12px;color:var(--text-dim);display:flex;gap:4px;align-items:center;padding-left:6px;border-left:1px solid var(--border)}
.pal-oth .cbtn{width:18px;height:18px;cursor:default}
.who{font-size:12px;color:var(--text-help)}
.cbtn{width:22px;height:22px;border-radius:9999px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;padding:0;flex:0 0 auto;vertical-align:middle}
.cbtn.c1{background:var(--mk1)} .cbtn.c2{background:var(--mk2)} .cbtn.c3{background:var(--mk3)} .cbtn.c4{background:var(--mk4)} .cbtn.c5{background:var(--mk5)}
td.cc,th.cc{width:34px;text-align:center}
td.sel,th.sel{width:34px;text-align:center}
td.sel input{width:18px;height:18px}
.pal{position:fixed;z-index:60;display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:999px}

.pal .btn{padding:4px 10px;font-size:13px}
tr.over td{color:var(--alert-text)}
tr.over td.sf{font-weight:700}
tr.grp td{background:var(--surface-2);font-weight:600;color:var(--head);cursor:pointer}
tr.grp.g2 td:first-child{padding-left:22px}
tr.grp.g1 td{background:var(--grp-cust)}
/* Примечание договора — в строке дерева, одной строкой с многоточием; щелчок — правка на месте */
.gh{display:flex;align-items:center;gap:10px;min-width:0;width:100%}
.gh>.gl{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gnote{flex:1 1 140px;min-width:0;display:flex;gap:6px;align-items:center;font-weight:400;font-size:13px;color:var(--text-dim);cursor:text;overflow:hidden}
.gnote>.nt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gnote>.nt.ph{color:var(--text-help)}
.gnote>.nl{flex:0 0 auto;color:var(--text-help)}
.gnote:hover>.nt{text-decoration:underline dotted}
.gnote input{flex:1 1 auto;min-width:0;padding:3px 8px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--text)}
.tag.ok{background:var(--ok);color:var(--ok-text);border-color:var(--ok)}
.tag.warn{background:var(--warn);color:var(--warn-text);border-color:var(--warn)}
.sfq{white-space:nowrap}
.buh-st{border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.buh-st p{margin:0;flex:1 1 260px;color:var(--text-dim)}

.buh-st.ask p{color:var(--soft-text)}
h3.sub{font-size:15px;color:var(--head);margin:18px 0 8px}
.dlg{position:fixed;inset:0;z-index:50;background:var(--veil);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg-box{width:100%;max-width:600px;max-height:88vh;overflow:auto;padding:18px}
.dlg-box h2{font-size:17px;margin:0 0 10px;color:var(--head)}
.dlg-box p{margin:0 0 10px;white-space:pre-line}
.dlg-box ol{margin:0 0 10px;padding-left:22px}
.dlg-box li{margin-bottom:8px}
.dlg-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}

.sf-row .sf-d{grid-column:1;font-size:13px;color:var(--text-dim)}
.sf-row input{grid-column:2;grid-row:1 / 3}

.dlg-box input{padding:8px 10px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);width:100%;min-width:0}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}

@media (max-width:480px){ .fld{grid-template-columns:1fr} .sf-row{grid-template-columns:1fr 90px} }
</style>

<script id="web-crypt">
// ===== 🔐 WEB-CRYPT — шифрование выкладки в интернет (эталон; копии в weltklasse_kp.html и weltklasse_mobile.html сверяет tests/web_crypt.test.js) =====
// Конверт: {app:'weltklasse-web', v:1, kind:'staff'|'phone'|'off', savedAt, salt:b64(16), iv:b64(12), iter, data:b64(AES-GCM(gzip(JSON)))}; у 'off' — без salt/iv/data.
// Ключ — PBKDF2-SHA-256 из пароля, WEB_ITER повторов. Ошибки — Error с code: BAD_PASSWORD · BAD_FORMAT · OFF.
const WEB_ITER=250000;
function webCryptOk(){ try{ return !!(globalThis.crypto&&crypto.subtle&&crypto.getRandomValues&&typeof CompressionStream==='function'&&typeof DecompressionStream==='function'&&typeof TextEncoder==='function'); }catch(e){ return false; } }
function _webErr(code){ const e=new Error(code); e.code=code; return e; }
function _webB64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function _webUnB64(s){ if(typeof s!=='string'||!/^[A-Za-z0-9+/]*={0,2}$/.test(s)) throw _webErr('BAD_FORMAT');
  let b; try{ b=atob(s); }catch(e){ throw _webErr('BAD_FORMAT'); } const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function _webPipe(u8,stream){ return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(stream)).arrayBuffer()); }
async function _webKey(password,salt,iter){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(String(password||'')),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function webSeal(obj,password,kind){
  if(!['staff','phone','off'].includes(kind)) throw _webErr('BAD_FORMAT');
  const env={app:'weltklasse-web',v:1,kind,savedAt:new Date().toISOString()};
  if(kind==='off') return env;
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12));
  const gz=await _webPipe(new TextEncoder().encode(JSON.stringify(obj)),new CompressionStream('gzip'));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await _webKey(password,salt,WEB_ITER),gz));
  return Object.assign(env,{salt:_webB64(salt),iv:_webB64(iv),iter:WEB_ITER,data:_webB64(ct)});
}
async function webOpen(env,password){
  if(!env||typeof env!=='object'||env.app!=='weltklasse-web'||env.v!==1) throw _webErr('BAD_FORMAT');
  if(env.kind==='off') throw _webErr('OFF');
  if(!['staff','phone'].includes(env.kind)||!Number.isInteger(env.iter)||env.iter<1||typeof env.data!=='string') throw _webErr('BAD_FORMAT');
  const salt=_webUnB64(env.salt), iv=_webUnB64(env.iv), ct=_webUnB64(env.data);
  if(salt.length!==16||iv.length!==12||ct.length<17) throw _webErr('BAD_FORMAT');
  let gz; try{ gz=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},await _webKey(password,salt,env.iter),ct)); }catch(e){ throw _webErr('BAD_PASSWORD'); }
  try{ return JSON.parse(new TextDecoder().decode(await _webPipe(gz,new DecompressionStream('gzip')))); }catch(e){ throw _webErr('BAD_FORMAT'); }
}
// ===== /WEB-CRYPT =====

<script id="web-view">
// ===== Чистые помощники вида (tests/web_view.test.js) =====
function viewFmt(n){ return Math.round(+n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); }   // как fmtUZS программы
function _vLow(s){ return String(s==null?'':s).toLowerCase(); }
function _vArt(s){ return _vLow(s).replace(/[\s\-.\/_]+/g,''); }
// Время данных: местное «данные на дд.мм чч:мм»; старше суток → old
function viewAge(savedAt,nowMs){
  const d=new Date(savedAt||''); if(!savedAt||isNaN(d.getTime())) return {text:'',old:false};
  const z=x=>String(x).padStart(2,'0');
  return {text:'данные на '+z(d.getDate())+'.'+z(d.getMonth()+1)+' '+z(d.getHours())+':'+z(d.getMinutes()), old:(nowMs-d.getTime())>864e5};
}
// Время последнего изменения меток: {hm:'чч:мм', tip} из savedAt файла пометок; нет/мусор → пусто
function viewMarksAge(savedAt){
  const d=new Date(savedAt||''); if(!savedAt||isNaN(d.getTime())) return {hm:'',tip:''};
  const z=x=>String(x).padStart(2,'0'), hm=z(d.getHours())+':'+z(d.getMinutes());
  return {hm, tip:'метки обновлены '+hm+':'+z(d.getSeconds())+' (файл пометок бухгалтерии)'};
}
// Склад: строки снимка, где запрос входит в текстовые колонки (артикул — без пробелов/дефисов/точек)
function viewStockFilter(snap,q){
  const rows=(snap&&snap.stock)||[], cols=(snap&&snap.stockCols)||[], ql=_vLow(q).trim(), qa=_vArt(q);
  if(!ql) return rows.slice();
  return rows.filter(r=>cols.some((c,i)=>c.k==='num'?false:c.k==='art'?(!!qa&&_vArt(r[i]).includes(qa)):_vLow(r[i]).includes(ql)));
}
function viewWbProjects(wbs){ return [...new Set((wbs||[]).map(w=>w.project||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru')); }
// Накладные: новые сверху (дата, затем номер по убыванию); фильтр по проекту; поиск по шапке и позициям
// Деньги накладной: возврат «В» — −|x| (позиции в снимке положительные); рекламация «Р» (брак забран, не деньги) и выдача — как есть
function viewWbMoney(wb,x){ const n=+x||0; return wb&&wb.type==='ret'?-Math.abs(n):n; }
// Документ накладной: полная подпись снимка (docText), у старого снимка — прежний doc
function viewWbDoc(w){ return String((w&&(w.docText||w.doc))||''); }
// Ключ фильтра «Документ»: договор (по номеру) · ДОП №n к договору · «договора нет» · без договора; старый снимок — по doc
function _viewDocKey(w){ const k=w&&w.docKind;
  if(k==='ctr') return 'c|'+(w.ctrNum||''); if(k==='dop') return 'd|'+(w.ctrNum||'')+'|'+(w.dopN==null?'':w.dopN);
  if(k==='pending') return 'p'; if(k==='none') return 'n'; return 'o|'+viewWbDoc(w); }
// Пункты фильтра «Документ» из снимка (project — только его накладные): договоры по номеру, под каждым его ДОП по №, затем старые подписи, «договора нет», «без договора». → [{key,label}]
function viewWbDocs(wbs,project){ const m=new Map();
  (wbs||[]).filter(w=>!project||w.project===project).forEach(w=>{ const key=_viewDocKey(w); if(m.has(key)) return; const k=w.docKind, c=String(w.ctrNum||'');
    const label=k==='ctr'?'по договору № '+(c||'—'):k==='dop'?'ДОП №'+(w.dopN==null?'?':w.dopN)+(c?' к № '+c:''):k==='pending'?'договора нет':k==='none'?'без договора':viewWbDoc(w);
    if(!label) return; m.set(key,{key,label,g:k==='ctr'||k==='dop'?0:k==='pending'?2:k==='none'?3:1,c,n:k==='dop'?(+w.dopN||0):-1}); });
  return [...m.values()].sort((a,b)=>a.g-b.g||a.c.localeCompare(b.c,'ru')||a.n-b.n||a.label.localeCompare(b.label,'ru')).map(x=>({key:x.key,label:x.label})); }
function viewWbFilter(wbs,f){
  f=f||{}; const ql=_vLow(f.q).trim(), qa=_vArt(f.q);
  const hit=w=>!ql||[w.num,w.project,w.customer,w.doc,w.docText,w.statusLabel].some(x=>_vLow(x).includes(ql))
    ||(w.items||[]).some(it=>(!!qa&&_vArt(it.article).includes(qa))||_vLow(it.name).includes(ql));
  return (wbs||[]).filter(w=>(!f.project||w.project===f.project)&&(!f.doc||_viewDocKey(w)===f.doc)&&hit(w))
    .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.num||'').localeCompare(String(a.num||''),'ru'));
}

<script id="web-buh">
// ===== Бухгалтерия: отгружено по проектам и договорам, пометки с/ф (tests/web_buh.test.js). Чистые функции — ничего не пишут. =====
// Объектов нет (владелец 2026-10-06): ключ — project+'|' (поле object накладных и старых пометок не учитывается — они считаются в свой проект);
// ключ артикула — без пробелов, в верхнем регистре. Пометка с/ф с договором — поле ctr (ключ договора _sfCtr: c|№ · pending · none · o|doc).
// Отгружено: «Н» (не черновик) плюс, «В» минус; «Р» — брак забран с объекта, не отгрузка.
const BUH_APP='weltklasse-buh-marks';
function buhArt(s){ return String(s==null?'':s).replace(/\s+/g,'').toUpperCase(); }
function buhObjKey(project){ return String(project||'')+'|'; }
function _buhSign(w){ return !w||w.status==='draft'?0:w.type==='ret'?-1:w.type==='rek'?0:1; }
function objShipped(waybills){
  const out=new Map();
  (waybills||[]).forEach(w=>{ const sg=_buhSign(w); if(!sg) return; const ok=buhObjKey(w.project);
    if(!out.has(ok)) out.set(ok,new Map()); const mp=out.get(ok);
    (w.items||[]).forEach(it=>{ const A=buhArt(it.article); if(!A) return;
      if(!mp.has(A)) mp.set(A,{article:String(it.article),name:it.name||'',qty:0});
      const r=mp.get(A); r.qty+=sg*(+it.qty||0); if(!r.name&&it.name) r.name=it.name; }); });
  return out;
}
// Документы отгрузок проекта (article — только накладные с этим артикулом; ctr — только этого договора): «Н» не черновик, по датам, без повторов;
// подпись — docText снимка, у старого снимка — doc. → [строка]
function objDocs(waybills,project,article,ctr){ const ok=buhObjKey(project), A=article?buhArt(article):'', out=[];
  (waybills||[]).filter(w=>_buhSign(w)>0&&buhObjKey(w.project)===ok&&(!ctr||_sfCtr(w).key===ctr)&&(!A||(w.items||[]).some(it=>buhArt(it.article)===A)))
    .sort(_buhByDate).forEach(w=>{ const d=String(w.docText||w.doc||''); if(d&&!out.includes(d)) out.push(d); });
  return out; }
function _buhLive(marks){ return (marks||[]).filter(x=>x&&!x.del); }
// Отмечено в с/ф: objKey (проект) → ART → сумма (все договоры)
function _buhMarkSum(marks){ const s=new Map();
  _buhLive(marks).forEach(x=>{ const ok=buhObjKey(x.project), A=buhArt(x.article); if(!A) return;
    if(!s.has(ok)) s.set(ok,new Map()); const mp=s.get(ok); mp.set(A,(mp.get(A)||0)+(+x.qty||0)); }); return s; }
function sfLeft(row){ return Math.max(0,(+(row&&row.shipped)||0)-(+(row&&row.inSf)||0)); }
// Строки сводки по проекту (все договоры вместе): f.project ''/null — все проекты
function objSummary(snap,marks,f){
  f=f||{}; if(!snap) return [];
  const S=objShipped(snap.waybills), M=_buhMarkSum(marks), rows=[], seen=new Set();
  const want=ok=>!f.project||ok===buhObjKey(f.project);
  const add=(ok,A,sh,name,article,noShip)=>{ const inSf=(M.get(ok)&&M.get(ok).get(A))||0;
    rows.push({project:ok.slice(0,-1),objKey:ok,article,ART:A,name:name||'',shipped:sh,inSf,
      left:Math.max(0,sh-inSf),over:Math.max(0,inSf-sh),noShip}); seen.add(ok+'\n'+A); };
  S.forEach((mp,ok)=>{ if(want(ok)) mp.forEach((r,A)=>add(ok,A,r.qty,r.name,r.article,false)); });
  _buhLive(marks).forEach(x=>{ const ok=buhObjKey(x.project), A=buhArt(x.article);
    if(A&&want(ok)&&!seen.has(ok+'\n'+A)) add(ok,A,0,'',String(x.article),true); });
  return rows.sort((a,b)=>a.objKey.localeCompare(b.objKey,'ru')||a.ART.localeCompare(b.ART));
}
const _buhByDate=(a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.num||'').localeCompare(String(b.num||''),'ru');
// Отгружено по позициям «Н» за вычетом возвратов «В»: возврат снимается с самых поздних накладных проекта → {wbId:{itemIdx:net}}
function wbNet(waybills){
  const ws=waybills||[], res={}, ret=new Map();
  ws.filter(w=>_buhSign(w)<0).forEach(w=>{ const ok=buhObjKey(w.project);
    (w.items||[]).forEach(it=>{ const k=ok+'\n'+buhArt(it.article); ret.set(k,(ret.get(k)||0)+Math.max(0,+it.qty||0)); }); });
  const outs=ws.filter(w=>_buhSign(w)>0).sort(_buhByDate);
  outs.forEach(w=>{ res[w.id]={}; (w.items||[]).forEach((it,i)=>{ res[w.id][i]=Math.max(0,+it.qty||0); }); });
  outs.slice().reverse().forEach(w=>{ const ok=buhObjKey(w.project);
    (w.items||[]).slice().map((it,i)=>i).reverse().forEach(i=>{ const k=ok+'\n'+buhArt(w.items[i].article), r=ret.get(k)||0; if(!r) return;
      const t=Math.min(r,res[w.id][i]); res[w.id][i]-=t; ret.set(k,r-t); }); });
  return res;
}
// Отмеченное раскладывается по накладным «Н» по порядку дат (затем номера), не больше отгруженного за вычетом возвратов:
// сперва пометки с договором (ctr) — по накладным этого договора проекта, затем старые (без ctr, объект не важен; договора ctr нет в проекте — тоже) — по всем накладным проекта.
// → {res:{wbId:{itemIdx:inSf}}, rest:Map('проект|\nctr\nART' → не разложено), ctrs:Set('проект|\nctr')}
function _buhLay(waybills,marks){
  const NET=wbNet(waybills), res={}, outs=(waybills||[]).filter(w=>_buhSign(w)>0).sort(_buhByDate), left=new Map(), ctrs=new Set();
  outs.forEach(w=>{ res[w.id]={}; (w.items||[]).forEach((it,i)=>{ res[w.id][i]=0; }); ctrs.add(buhObjKey(w.project)+'\n'+_sfCtr(w).key); });
  _buhLive(marks).forEach(x=>{ const ok=buhObjKey(x.project), A=buhArt(x.article); if(!A) return;
    const c=x.ctr&&ctrs.has(ok+'\n'+x.ctr)?String(x.ctr):'', k=ok+'\n'+c+'\n'+A; left.set(k,(left.get(k)||0)+(+x.qty||0)); });
  const pass=byCtr=>outs.forEach(w=>{ const ok=buhObjKey(w.project), c=byCtr?_sfCtr(w).key:'';
    (w.items||[]).forEach((it,i)=>{ const k=ok+'\n'+c+'\n'+buhArt(it.article), l=Math.max(0,left.get(k)||0), t=Math.min(l,NET[w.id][i]-res[w.id][i]);
      if(t>0){ res[w.id][i]+=t; left.set(k,l-t); } }); });
  pass(true); pass(false);
  return {res,rest:left,ctrs};
}
function wbMarked(waybills,marks){ return _buhLay(waybills,marks).res; }
// Накладная в с/ф: 'full' | 'part' | 'none'; не «Н» или нет раскладки — ''. net — wbNet(…)[wbId] (без него — количества позиций)
function wbSfState(w,marked,net){
  if(!marked||_buhSign(w)<=0) return '';
  let all=0, got=0; (w.items||[]).forEach((it,i)=>{ const q=net?Math.max(0,+net[i]||0):Math.max(0,+it.qty||0); all+=q; got+=Math.min(q,+marked[i]||0); });
  return !got?(all?'none':'full'):got>=all?'full':'part';
}
// Дерево вкладки «Счёт-фактуры»: Покупатель ▶ проект · договор ▶ отгруженное. → [{customer, contracts:[{key, ctrNum, project, kind, label, dops, rows}]}]
// Договор — по накладным «Н» (не черновик): ДОП — под свой основной договор (ctrNum), «договора нет», «без договора», старый снимок — по doc.
// Строки — форма objSummary по проекту и артикулу (+ ctr, ctrLabel — договор строки): отгружено = wbNet (возврат «В» снят с поздних «Н» проекта), в с/ф = wbMarked;
// лишнее в с/ф (больше отгруженного): пометки с договором — в свой договор, старые — в договор последней накладной артикула;
// пометка без отгрузки — в свой договор (с ctr), иначе в договор последней накладной проекта (накладных нет — группа «нет в отгрузке»).
const _SF_KO={ctr:0,dop:0,o:1,pending:2,none:3,x:4};
function _sfCtr(w){ const k=w&&w.docKind;
  if(k==='ctr'||k==='dop') return {key:'c|'+(w.ctrNum||''),kind:'ctr',ctrNum:String(w.ctrNum||'')};
  if(k==='pending'||k==='none') return {key:k,kind:k,ctrNum:''};
  return {key:'o|'+String((w&&(w.docText||w.doc))||''),kind:'o',ctrNum:'',doc:String((w&&(w.docText||w.doc))||'')}; }
function _sfLabel(g){ const dm=s=>{ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||''); return m?m[3]+'.'+m[2]+'.'+m[1].slice(2):''; };
  if(g.kind==='ctr'){ const n=g.ctrNum||'—', d=dm(g.ctrDate);
    return 'Договор № '+n+(d?' от '+d:'')+(g.dops.length?' · '+g.dops.map(x=>'ДОП №'+x).join(', ')+' к № '+n:''); }
  return g.kind==='pending'?'договора нет':g.kind==='none'?'без договора':g.kind==='x'?'нет в отгрузке':(g.doc||'документ не указан'); }
function sfTree(snap,marks){
  if(!snap) return [];
  const ws=snap.waybills||[], NET=wbNet(ws), LAY=_buhLay(ws,marks), MK=LAY.res, G=new Map(), last=new Map(), lastP=new Map(), cust=new Map(), byPC=new Map(), names=new Map();
  ws.forEach(w=>{ const c=String(w.customer||'').trim(); if(c&&!cust.has(w.project||'')) cust.set(w.project||'',c); });
  const grp=(cu,project,c)=>{ const gk=cu+'\n'+project+'\n'+c.key; let g=G.get(gk);
    if(!g){ g={customer:cu,project,ckey:c.key,kind:c.kind,ctrNum:c.ctrNum,ctrDate:'',doc:c.doc||'',dops:[],rows:new Map()}; G.set(gk,g); byPC.set(buhObjKey(project)+'\n'+c.key,g); } return g; };
  const nrow=(g,ok,A,article,name)=>{ const r={project:g.project,ctr:g.ckey,ctrLabel:'',objKey:ok,article,ART:A,name:name||'',shipped:0,inSf:0,left:0,over:0,noShip:true}; g.rows.set(ok+'\n'+A,r); return r; };
  const row=(g,w,it)=>{ const ok=buhObjKey(w.project), A=buhArt(it.article), rk=ok+'\n'+A; let r=g.rows.get(rk);
    if(!r){ r=nrow(g,ok,A,String(it.article),it.name); r.noShip=false; }
    if(!r.name&&it.name) r.name=it.name; return r; };
  ws.filter(w=>_buhSign(w)>0).sort(_buhByDate).forEach(w=>{ const c=_sfCtr(w), g=grp(String(w.customer||'').trim()||'—',String(w.project||''),c);
    if(c.kind==='ctr'&&w.docKind==='ctr'&&!g.ctrDate&&w.ctrDate) g.ctrDate=String(w.ctrDate);
    if(w.docKind==='dop'&&w.dopN!=null&&!g.dops.includes(+w.dopN)) g.dops.push(+w.dopN);
    (w.items||[]).forEach((it,i)=>{ if(!buhArt(it.article)) return; const r=row(g,w,it);
      r.shipped+=(NET[w.id]&&NET[w.id][i])||0; r.inSf+=(MK[w.id]&&MK[w.id][i])||0; last.set(r.objKey+'\n'+r.ART,r); }); lastP.set(g.project,g); });
  _buhLive(marks).forEach(x=>{ const A=buhArt(x.article); if(A&&!names.has(A)) names.set(A,String(x.article)); });
  LAY.rest.forEach((rest,k)=>{ if(rest<=0) return; const [ok,c,A]=k.split('\n'), project=ok.slice(0,-1);
    const gc=c&&byPC.get(ok+'\n'+c); let r=gc?gc.rows.get(ok+'\n'+A):last.get(ok+'\n'+A);
    if(!r){ const g=gc||lastP.get(project)||grp(cust.get(project)||'—',project,{key:'x',kind:'x',ctrNum:''}); r=g.rows.get(ok+'\n'+A)||nrow(g,ok,A,names.get(A)||A,''); }
    r.inSf+=rest; });
  const byC=new Map();
  [...G.values()].sort((a,b)=>a.project.localeCompare(b.project,'ru')||_SF_KO[a.kind]-_SF_KO[b.kind]||a.ctrNum.localeCompare(b.ctrNum,'ru',{numeric:true})||a.doc.localeCompare(b.doc,'ru'))
    .forEach(g=>{ g.dops.sort((x,y)=>x-y);
      const label=_sfLabel(g), rows=[...g.rows.values()].map(r=>Object.assign(r,{ctrLabel:label,left:Math.max(0,r.shipped-r.inSf),over:Math.max(0,r.inSf-r.shipped)}))
        .sort((a,b)=>a.ART.localeCompare(b.ART));
      if(!byC.has(g.customer)) byC.set(g.customer,[]);
      byC.get(g.customer).push({key:g.project+'|'+g.ckey,ctrNum:g.ctrNum,project:g.project,kind:g.kind,label,dops:g.dops.slice(),rows}); });
  return [...byC.keys()].sort((a,b)=>a==='—'?1:b==='—'?-1:a.localeCompare(b,'ru')).map(c=>({customer:c,contracts:byC.get(c)}));
}
// Шапка вкладки (владелец 2026-10-05, подписи 2026-10-06): списки «Покупатель» и «Номер договора» из дерева. customer '' — договоры всех покупателей.
// Договор — «проект · № X», ДОП отдельным пунктом не бывает (он внутри своего договора); прочие — «проект · договора нет» и т. п.
function sfCustLabel(c){ return c==='—'?'— покупатель не указан':String(c); }
function sfLists(tree,customer){ const t=tree||[];
  return {customers:t.map(c=>({v:c.customer,label:sfCustLabel(c.customer)})),
    contracts:[].concat(...t.filter(c=>!customer||c.customer===customer).map(c=>c.contracts.map(k=>({v:k.key,
      label:(k.project||'—')+' · '+(k.kind==='ctr'?'№ '+(k.ctrNum||'—'):k.label)}))))}; }
// Дерево только с выбранным: {customer:''|имя, contract:''|key}
function sfFilter(tree,f){ f=f||{};
  return (tree||[]).filter(c=>!f.customer||c.customer===f.customer)
    .map(c=>({customer:c.customer,contracts:c.contracts.filter(k=>!f.contract||k.key===f.contract)})).filter(c=>c.contracts.length); }
// Ключ примечания договора в notes файла пометок (рядом с wbId накладных): 'ctr|<проект|договор>'; старые 'obj|…' в файле остаются, не показываются
function sfNoteKey(ctrKey){ return 'ctr|'+ctrKey; }
// Незаписанное: пометки памяти, которых нет в файле или они новее (правка/удаление), и цвета новее → {marks:[id], colors}
function marksUnsaved(mem,disk){
  if(!mem) return {marks:[],colors:false,notes:[]};
  const d=new Map(((disk&&disk.marks)||[]).map(m=>[m.id,m]));
  const marks=(mem.marks||[]).filter(m=>{ const x=d.get(m.id); return !x||(+m.ts||0)>(+x.ts||0)||(!!m.del&&!x.del); }).map(m=>m.id);
  const dn=notesNorm(disk&&disk.notes), mn=notesNorm(mem.notes);
  return {marks,colors:colorsNewer(colNorm(mem.colors,mem.colorsTs,'—'),colNorm(disk&&disk.colors,disk&&disk.colorsTs,'—')),
    notes:Object.keys(mn).filter(id=>!dn[id]||mn[id].ts>dn[id].ts||(mn[id].ts===dn[id].ts&&mn[id].text!==dn[id].text))};
}
// Один файл в папке: облако («конфликтующая копия») и прочие копии «пометки_бухгалтерии*.json» (кроме основного; .crswap — не трогаем) сливаются в основной
const BUH_MAIN='пометки_бухгалтерии.json';
function buhCopyNames(names){ const pre=BUH_MAIN.slice(0,-5).toLowerCase();
  return (names||[]).filter(n=>{ const l=String(n||'').toLowerCase(); return l!==BUH_MAIN&&l.startsWith(pre)&&l.endsWith('.json'); }); }
// Писать основной файл, только если в нём чего-то не хватает (тот же текст не перезаписывается при каждом перечитывании)
function marksNeedWrite(disk,merged){ if(!disk) return true; const u=marksUnsaved(merged,disk); return u.marks.length>0||u.colors||u.notes.length>0; }
function _buhFmt(n){ return Math.round(+n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
// Предупреждение «больше, чем осталось внести»; extra — своя пометка, которую правят (не считается «уже в с/ф»)
function overText(r,extra){ const was=(+r.inSf||0)-(+extra||0);
  return '«'+r.article+'» ('+r.project+(r.ctrLabel?' · '+r.ctrLabel:'')+'): отгружено '+_buhFmt(r.shipped)+', уже в с/ф '+_buhFmt(was)+' — можно отметить только '+_buhFmt(Math.max(0,(+r.shipped||0)-was))+'.'; }
function _buhEmpty(){ return {app:BUH_APP,v:1,savedAt:'',marks:[],colors:{},colorsTs:0,notes:{}}; }
// Примечания бухгалтерии к накладным: notes = {wbId:{text,who,ts}}; пустой text — снятое примечание (с ts, чтобы снятие дошло до других)
function notesNorm(n){ const out={}; if(!n||typeof n!=='object'||Array.isArray(n)) return out;
  Object.keys(n).forEach(id=>{ const x=n[id]; if(x&&typeof x==='object'&&typeof x.text==='string') out[id]={text:x.text,who:String(x.who||''),ts:+x.ts||0}; });
  return out; }
// Слияние: по wbId больший ts; при равном — больший текст (порядок слияния итог не меняет)
function notesMerge(a,b){ const A=notesNorm(a), Bn=notesNorm(b), out={};
  [...new Set([...Object.keys(A),...Object.keys(Bn)])].sort().forEach(id=>{ const x=A[id], y=Bn[id];
    out[id]=Object.assign({},!x?y:!y?x:x.ts!==y.ts?(x.ts>y.ts?x:y):(x.text>=y.text?x:y)); });
  return out; }
// Файл пометок: текст или объект → {ok:true,file} | {ok:false,err:'FOREIGN'|'BAD'}
function marksCheck(x){
  let o=x; if(typeof x==='string'){ try{ o=JSON.parse(x); }catch(e){ return {ok:false,err:'BAD'}; } }
  if(!o||typeof o!=='object'||o.app!==BUH_APP) return {ok:false,err:'FOREIGN'};
  if(o.v!==1||!Array.isArray(o.marks)||(o.colors!=null&&(typeof o.colors!=='object'||Array.isArray(o.colors)))) return {ok:false,err:'BAD'};
  return {ok:true,file:{app:BUH_APP,v:1,savedAt:o.savedAt||'',marks:o.marks.filter(m=>m&&typeof m==='object'&&m.id),colors:colNorm(o.colors,o.colorsTs,'—'),colorsTs:+o.colorsTs||0,notes:notesNorm(o.notes)}};
}
// Слияние: пометки по id (больший ts; удалённая — навсегда), цвета — по ключу и автору (больший ts; colorsMerge)
function marksMerge(a,b){
  a=a||_buhEmpty(); b=b||_buhEmpty();
  const by=new Map();
  [...(a.marks||[]),...(b.marks||[])].forEach(m=>{ if(!m||!m.id) return; const p=by.get(m.id);
    if(!p){ by.set(m.id,Object.assign({},m)); return; }
    const del=!!(p.del||m.del), nw=(+m.ts||0)>(+p.ts||0)?Object.assign({},m):p;
    if(del) nw.del=true; by.set(m.id,nw); });
  const sa=String(a.savedAt||''), sb=String(b.savedAt||'');
  return {app:BUH_APP,v:1,savedAt:sa>sb?sa:sb,marks:[...by.values()],
    colors:colorsMerge(colNorm(a.colors,a.colorsTs,'—'),colNorm(b.colors,b.colorsTs,'—')),colorsTs:Math.max(+a.colorsTs||0,+b.colorsTs||0),notes:notesMerge(a.notes,b.notes)};
}
// Цвета: colors = {'вкладка|строка': {автор: {c:1..5, ts, del?}}} — у каждого бухгалтера свой цвет строки; del — снял (с ts, чтобы снятие дошло до других).
// Старый формат {'вкладка|строка': n} + colorsTs читается как автор «—» (colNorm). «—» и пометки без автора правит любой (buhMine).
const _colOk=c=>Number.isInteger(c)&&c>=1&&c<=5;
function colNorm(colors,ts,who){ const out={};
  if(!colors||typeof colors!=='object') return out;
  Object.keys(colors).forEach(k=>{ const v=colors[k];
    if(typeof v==='number'){ if(_colOk(v)) out[k]={[who||'—']:{c:v,ts:+ts||0}}; return; }
    if(!v||typeof v!=='object') return; const e={};
    Object.keys(v).forEach(a=>{ const x=v[a]; if(x&&typeof x==='object'&&_colOk(+x.c)) e[a]=Object.assign({c:+x.c,ts:+x.ts||0},x.del?{del:true}:{}); });
    if(Object.keys(e).length) out[k]=e; });
  return out; }
// Кто новее: больший ts; при равном — снятие, затем больший цвет (чтобы порядок слияния не менял итог)
const _colWin=(x,y)=>!x?y:!y?x:(x.ts!==y.ts?(x.ts>y.ts?x:y):(!!x.del!==!!y.del?(x.del?x:y):(x.c>=y.c?x:y)));
function colorsMerge(a,b){ const out={}; a=colNorm(a,0,'—'); b=colNorm(b,0,'—');
  [...new Set([...Object.keys(a),...Object.keys(b)])].sort().forEach(k=>{ const ea=a[k]||{}, eb=b[k]||{}, e={};
    [...new Set([...Object.keys(ea),...Object.keys(eb)])].sort().forEach(w=>{ e[w]=Object.assign({},_colWin(ea[w],eb[w])); }); out[k]=e; });
  return out; }
// Есть ли в памяти цвет новее, чем в файле
function colorsNewer(mem,disk){ return Object.keys(mem||{}).some(k=>Object.keys(mem[k]).some(w=>{ const d=disk&&disk[k]&&disk[k][w], m=mem[k][w];
  return !d||m.ts>d.ts||(m.ts===d.ts&&(!!m.del!==!!d.del||m.c!==d.c)); })); }
// Цвета строки: [{who,c}] по имени автора, без снятых (число старого формата — автор «—»)
function colList(colors,k){ const v=(colors||{})[k];
  if(typeof v==='number') return _colOk(v)?[{who:'—',c:v}]:[];
  if(!v||typeof v!=='object') return [];
  return Object.keys(v).filter(w=>v[w]&&!v[w].del&&_colOk(+v[w].c)).sort((x,y)=>x.localeCompare(y,'ru')).map(w=>({who:w,c:+v[w].c})); }
// Поставить (c 1..5) или снять (c 0) свой цвет строки → новая карта; чужие цвета не трогаются
function colSet(colors,k,who,c,ts){ const out=colNorm(colors,0,'—'), e=Object.assign({},out[k]||{}), p=e[who];
  if(c) e[who]={c:+c,ts:+ts||0}; else if(p&&!p.del) e[who]={c:p.c,ts:+ts||0,del:true}; else return out;
  out[k]=e; return out; }
// Вид строки (вариант В владельца): entry = colors[k] → {bg, tags:[{who,c,ts}]}; метки всех авторов по времени (первый — первым),
// фон — цвет того, кто покрасил первым (меньший ts среди не снятых; при равном — по имени); снял первый — фон следующего.
function rowPaint(entry){ const v=colNorm({k:entry},0,'—').k||{};
  const tags=Object.keys(v).filter(w=>!v[w].del).map(w=>({who:w,c:v[w].c,ts:v[w].ts})).sort((a,b)=>a.ts-b.ts||a.who.localeCompare(b.who,'ru'));
  return {bg:tags.length?'var(--mk'+tags[0].c+')':'',tags}; }
// Право правки: своё, а также старое без автора («—» или пусто); без своего имени чужое не правится
function buhMine(author,me){ return !author||author==='—'||(!!me&&author===me); }
// Фильтр f: '' — все, 'any' — с любым цветом, '1'..'5' — строка подходит, если совпал любой из её цветов
function colHit(colors,k,f){ if(!f) return true; const l=colList(colors,k); return f==='any'?!!l.length:l.some(x=>x.c===+f); }
// Колонка «Кто» (владелец 2026-10-03): метка автора — первые две буквы имени («Ол», «Св»), без имени — «—»
function whoAbbr(name){ const a=Array.from(String(name==null?'':name).trim()); if(!a.length||a.join('')==='—') return '—';
  return a[0].toUpperCase()+(a[1]||''); }
// Метки строки (tags из rowPaint, по времени): видны max (2) первых, остальные — числом more («+N»)
function whoView(tags,max){ const t=tags||[], m=max||2;
  return {shown:t.slice(0,m).map(x=>({who:x.who,c:x.c,ab:whoAbbr(x.who)})),more:Math.max(0,t.length-m)}; }
// Накладная проходит фильтр цвета своим цветом (wb|<id>) или цветом любой позиции (wb|<id>|<№>)
function wbColorHit(w,colors,f){ return !f||colHit(colors,'wb|'+w.id,f)||(w.items||[]).some((x,i)=>colHit(colors,'wb|'+w.id+'|'+i,f)); }
// Снять цвета вкладки ('stock'|'wb'|'obj') → {colors (новая карта), n}; исходная не меняется.
// who задан (папка подключена) — снимаются только свои цвета и старые «—» (отметкой снятия с ts); без who (цвета этого браузера) — ключи вкладки удаляются целиком
function colorsClear(colors,tab,who,ts){ const pre=tab+'|'; let n=0;
  if(who==null){ const out={}; Object.keys(colors||{}).forEach(k=>{ if(k.startsWith(pre)) n++; else out[k]=colors[k]; }); return {colors:out,n}; }
  let out=colNorm(colors,0,'—');
  Object.keys(out).filter(k=>k.startsWith(pre)).forEach(k=>colList(out,k).forEach(x=>{ if(buhMine(x.who,who)){ out=colSet(out,k,x.who,0,ts); n++; } }));
  return {colors:out,n}; }
// Клавиатура как в Excel: grid — строки полей (в ячейке truthy — поле есть), pos {r,c} → {r,c} | null (некуда — оставить как есть)
// Enter/↓ — вниз по колонке, Shift+Enter/↑ — вверх; Tab — вправо, с конца строки — первое поле следующей; Shift+Tab — обратно; ←/→ — соседнее в строке
function xlTarget(grid,pos,key,shift){
  const G=grid||[], has=(r,c)=>r>=0&&r<G.length&&!!(G[r]&&G[r][c]);
  const vert=d=>{ for(let r=pos.r+d;r>=0&&r<G.length;r+=d) if(has(r,pos.c)) return {r,c:pos.c}; return null; };
  const horiz=(d,wrap)=>{ let r=pos.r, c=pos.c+d;
    while(r>=0&&r<G.length){ const L=(G[r]||[]).length;
      for(;c>=0&&c<L;c+=d) if(has(r,c)) return {r,c};
      if(!wrap) return null; r+=d; c=d>0?0:((G[r]||[]).length-1); }
    return null; };
  if(key==='Enter') return vert(shift?-1:1);
  if(key==='ArrowDown') return vert(1);
  if(key==='ArrowUp') return vert(-1);
  if(key==='Tab') return horiz(shift?-1:1,true);
  if(key==='ArrowRight') return horiz(1,false);
  if(key==='ArrowLeft') return horiz(-1,false);
  return null;
}

// ===== Цветные пометки строк (только вид). Ключ — вкладка + строка: stock|ART · wb|<id накладной>|<№ позиции> · obj|<проект>|ART (до 2026-10-06 — <проект|объект>) =====
// Папка бухгалтерии подключена — цвета в файле пометок (у всех бухгалтеров), иначе — в этом браузере (localStorage wkv_colors).

const LOCAL=(()=>{ try{ const o=JSON.parse(lsGet('wkv_colors')||'{}'); return {colors:colNorm(o&&o.colors,o&&o.colorsTs,WHO||'—'),colorsTs:+(o&&o.colorsTs)||0}; }catch(e){ return {colors:{},colorsTs:0}; } })();

const colMy=x=>!buhOn()||buhMine(x.who,WHO);   // свой цвет: без папки — любой
function colTitle(l){ return l.map(x=>(buhOn()?x.who+' — ':'')+COL_NAMES[x.c]).join(', '); }
// Вид строки: класс cN — цвет того, кто покрасил первым (rowPaint); метки авторов — colTags перед артикулом

function colAttr(k,cls){ const c=[cls||'',colCls(colP(k))].join(' ').trim(); return c?' class="'+c+'"':''; }
const _tsDmy=ts=>{ if(!ts) return ''; const d=new Date(ts), z=n=>String(n).padStart(2,'0'); return z(d.getDate())+'.'+z(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)+' '+z(d.getHours())+':'+z(d.getMinutes()); };
// Метки «Кто»: кружок цвета + две буквы имени (whoView), две первые по времени, остальные «+N»; полный список — в title

function palOpen(ev,btn){ ev.stopPropagation(); PAL_KEY=btn.dataset.ck||''; const p=$('pal'), l=colL(PAL_KEY), my=l.filter(colMy), oth=l.filter(x=>!colMy(x));

async function palPick(c){ palClose(); const k=PAL_KEY; if(!k) return;

  if(c) LOCAL.colors=colSet(LOCAL.colors,k,WHO||'—',c,Date.now()); else delete LOCAL.colors[k]; colSave(LOCAL); }

const COL_TABS={stock:'«Склад»',wb:'«Накладные» (накладные целиком и позиции)',obj:'«Счёт-фактуры»'};

  const on2=buhOn(), t2=on2?BUH.file:LOCAL; t2.colors=colorsClear(t2.colors,tab,on2?WHO:null,Date.now()).colors; colSave(t2); }

// ===== Клавиатура как в Excel: поля таблиц и окон с/ф (input[data-xr][data-xc]); цель выбирает чистая xlTarget =====
// Enter — вниз (значение подтверждается: уход с поля даёт change), Shift+Enter — вверх; Tab/Shift+Tab — вправо/влево с переносом строки;
// ↑/↓ — по колонке; ←/→ — в соседнее поле, когда курсор у края текста; Esc — вернуть значение, бывшее при входе в поле.
const XL_SEL='input[data-xr][data-xc]';
document.addEventListener('focusin',e=>{ const t=e.target; if(t&&t.matches&&t.matches(XL_SEL)) t.__v0=t.value; });
document.addEventListener('keydown',xlKey,true);
function xlKey(e){
  const t=e.target, k=e.key; if(!t||!t.matches||!t.matches(XL_SEL)||e.altKey||e.ctrlKey||e.metaKey||e.isComposing) return;
  const box=t.closest('.dlg-box,table'); if(!box) return;
  if(k==='Escape'){ if(t.type!=='checkbox'&&t.__v0!=null&&t.value!==t.__v0){ t.value=t.__v0; e.preventDefault(); e.stopImmediatePropagation(); } return; }
  if(!['Enter','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)) return;
  if(t.type==='date'&&k.startsWith('Arrow')) return;   // стрелки даты листают день/месяц/год
  if(k==='ArrowLeft'||k==='ArrowRight'){ let a=null, b=null; try{ a=t.selectionStart; b=t.selectionEnd; }catch(x){}
    if(a!=null&&(a!==b||(k==='ArrowLeft'?a>0:a<t.value.length))) return; }   // курсор не у края — двигается по тексту
  const els=[...box.querySelectorAll(XL_SEL)].filter(x=>!x.disabled&&x.offsetParent!==null);
  const rs=[...new Set(els.map(x=>+x.dataset.xr))].sort((a,b)=>a-b), grid=rs.map(()=>[]);
  els.forEach(x=>{ grid[rs.indexOf(+x.dataset.xr)][+x.dataset.xc]=x; });
  const to=xlTarget(grid,{r:rs.indexOf(+t.dataset.xr),c:+t.dataset.xc},k,e.shiftKey);
  if(k==='Enter') e.preventDefault();
  if(!to) return;   // некуда: Tab — обычный переход браузера, остальное — на месте
  e.preventDefault(); const el=grid[to.r][to.c]; el.focus();
  if(el.type!=='checkbox'&&el.type!=='date') try{ el.select(); }catch(x){}
}

function dlgClose(v){ $('dlg').classList.add('hide'); const r=_dlgRes; _dlgRes=null; if(r) r(v); }

// ===== Папка бухгалтерии: файл пометки_бухгалтерии.json (Chrome/Edge — showDirectoryPicker, дескриптор в IndexedDB wkv_fs) =====
const BUH_FILE=BUH_MAIN, BUH_OLD='старые_копии';
const BUH={h:null,ask:null,askState:'',asking:false,name:'',file:null,disk:null,bad:'',saved:'',q:Promise.resolve()};   // disk — последний прочитанный/записанный файл (с ним сверяется «не сохранено»)
const buhUnsaved=()=>marksUnsaved(BUH.file,BUH.disk);
const buhUnsavedN=()=>{ const u=buhUnsaved(); return u.marks.length+(u.colors?1:0)+(u.notes?u.notes.length:0); };
const BUH_BAD={
  BAD:n=>'Файл «'+BUH_FILE+'» в папке «'+n+'» повреждён. Мы его не трогаем и ничего в него не пишем. Выберите другую папку или покажите файл владельцу.',
  FOREIGN:n=>'В папке «'+n+'» лежит файл «'+BUH_FILE+'», но он не от этой страницы. Мы его не трогаем. Выберите папку «Weltklasse Бухгалтерия».',
  IO:n=>'Не удалось прочитать или записать файл в папке «'+n+'». Проверьте, что Яндекс.Диск работает и папка на месте, затем нажмите «↻ Обновить».'};
const buhCan=()=>typeof window.showDirectoryPicker==='function';
const buhOn=()=>!!(BUH.h&&BUH.file&&!BUH.bad);
const buhMarks=()=>(BUH.file&&BUH.file.marks)||[];
const _permErr=e=>!!e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
function _idb(){ return new Promise((res,rej)=>{ const q=indexedDB.open('wkv_fs',1); q.onupgradeneeded=()=>q.result.createObjectStore('h'); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function idbPut(k,v){ try{ const db=await _idb(); await new Promise(r=>{ const t=db.transaction('h','readwrite'); t.objectStore('h').put(v,k); t.oncomplete=r; t.onerror=r; }); }catch(e){} }
async function idbGet(k){ try{ const db=await _idb(); return await new Promise(r=>{ const q=db.transaction('h').objectStore('h').get(k); q.onsuccess=()=>r(q.result||null); q.onerror=()=>r(null); }); }catch(e){ return null; } }
// Копии «пометки_бухгалтерии*.json» в папке → {names:[годные копии], file: их слияние|null}; битые/чужие копии не трогаются
async function buhCopies(h){ const out={names:[],file:null}; let all=[];
  try{ for await (const k of h.keys()) all.push(k); }catch(e){ return out; }
  for(const n of buhCopyNames(all)){ try{ const c=marksCheck(await (await (await h.getFileHandle(n)).getFile()).text());
    if(c.ok){ out.names.push(n); out.file=marksMerge(out.file,c.file); } }catch(e){} }
  return out; }
// Слитые копии — в подпапку «старые_копии» (занятое имя → «_2», «_3»…). Не вышло — копия остаётся, бухгалтеру ничего не говорим
async function buhCopiesAway(h,names){ if(!names||!names.length) return;
  let d; try{ d=await h.getDirectoryHandle(BUH_OLD,{create:true}); }catch(e){ return; }
  for(const n of names){ try{
    const text=await (await (await h.getFileHandle(n)).getFile()).text();
    let to=n, i=1; for(;;){ try{ await d.getFileHandle(to); }catch(e){ break; } i++; to=n.replace(/(\.json)$/i,'_'+i+'$1'); }
    const w=await (await d.getFileHandle(to,{create:true})).createWritable(); await w.write(text); await w.close();
    await h.removeEntry(n); }catch(e){} } }
// → {ok:true,file|null,copies:{names,file}} | {ok:false,err:'BAD'|'FOREIGN'|'IO'|'PERM'}
async function buhRead(h){
  let fh; try{ fh=await h.getFileHandle(BUH_FILE); }catch(e){ if(e&&e.name==='NotFoundError') return {ok:true,file:null,copies:await buhCopies(h)}; return {ok:false,err:_permErr(e)?'PERM':'IO'}; }
  let text; try{ text=await (await fh.getFile()).text(); }catch(e){ return {ok:false,err:_permErr(e)?'PERM':'IO'}; }
  if(!String(text).trim()) return {ok:true,file:null,copies:await buhCopies(h)};
  const c=marksCheck(text); return c.ok?{ok:true,file:c.file,copies:await buhCopies(h)}:{ok:false,err:c.err};
}
// Разрешение спрашивается в том же щелчке, что вход («Открыть») или вкладка «Счёт-фактуры»: без окна-плашки, если браузер готов спросить ('prompt').
// Уже 'granted' — ничего не показывается (buhStartup подключает сам). Навсегда разрешение даёт только браузер: «Разрешать при каждом посещении» / установка как приложение.
function buhPermGesture(){ const h=BUH.ask; if(!h||BUH.asking||BUH.askState!=='prompt') return;
  try{ if(navigator.userActivation&&!navigator.userActivation.isActive) return; }catch(e){}
  let pr; try{ pr=h.requestPermission({mode:'readwrite'}); }catch(e){ return; }
  BUH.asking=true;
  Promise.resolve(pr).then(st=>{ BUH.asking=false; if(BUH.ask!==h) return; if(st==='granted') buhAttach(h); else { BUH.askState=st; buhRender(); } },()=>{ BUH.asking=false; }); }
// Цвета этого браузера при подключении папки становятся цветами автора WHO (по одному на строку — самый поздний)
function _localAsMine(){ const out={};
  Object.keys(LOCAL.colors).forEach(k=>{ const e=LOCAL.colors[k]||{}; let best=null;
    Object.keys(e).forEach(w=>{ const x=e[w]; if(x&&!x.del&&(!best||x.ts>best.ts)) best=x; });
    if(best) out[k]={[WHO||'—']:{c:best.c,ts:best.ts}}; });
  return out; }
async function buhAttach(h){
  // из прежней памяти в новую папку переносится только незаписанное (не терять пометку, но и не копировать чужую папку)
  const u=BUH.file?buhUnsaved():{marks:[],colors:false};
  const keep={app:BUH_APP,v:1,savedAt:'',marks:(BUH.file?BUH.file.marks:[]).filter(m=>u.marks.includes(m.id)),colors:u.colors?BUH.file.colors:{},colorsTs:u.colors?BUH.file.colorsTs:0,
    notes:Object.fromEntries((u.notes||[]).map(id=>[id,BUH.file.notes[id]]))};
  BUH.h=h; BUH.name=h.name||''; BUH.ask=null; BUH.bad='';
  const r=await buhRead(h);
  if(!r.ok){ if(r.err==='PERM'){ BUH.ask=h; BUH.h=null; } else BUH.bad=r.err; renderTab(); buhRender(); return false; }
  BUH.disk=r.file; BUH.file=marksMerge(marksMerge(r.file,keep),{app:BUH_APP,v:1,savedAt:'',marks:[],colors:_localAsMine(),colorsTs:LOCAL.colorsTs,notes:LOCALN});   // примечания этого браузера — в файл
  if(r.copies.file) BUH.file=marksMerge(BUH.file,r.copies.file);
  if(!r.file||buhUnsavedN()||r.copies.names.length) await buhWrite();
  renderTab(); buhRender(); return true;
}
async function buhStartup(){
  if(buhCan()){ const h=await idbGet('buh');
    if(h){ let st='prompt'; try{ st=await h.queryPermission({mode:'readwrite'}); }catch(e){}
      if(st==='granted') await buhAttach(h); else { BUH.ask=h; BUH.askState=st; BUH.name=h.name||''; } } }
  buhRender(); renderTab();
}
async function buhChoose(){
  if(!buhCan()){ say('В этом браузере нельзя','Этот браузер не умеет сохранять файл в папку на диске. Откройте эту ссылку на компьютере в Google Chrome или Microsoft Edge.'); return; }
  let h; try{ h=await window.showDirectoryPicker({id:'wk_buh',mode:'readwrite'}); }catch(e){ return; }   // окно закрыли
  await idbPut('buh',h);
  if(!WHO) await whoEdit(true);   // первое подключение — как подписывать пометки и цвета
  if(await buhAttach(h)) say('Папка подключена','Папка «'+(h.name||'')+'» подключена. Пометки с/ф сохраняются в ней сами, в файле «'+BUH_FILE+'». Не удаляйте и не переименовывайте этот файл.');
  else if(BUH.bad) say('Файл не трогаем',BUH_BAD[BUH.bad](BUH.name));
}
async function buhGrant(){ const h=BUH.ask; if(!h) return;
  let st=''; try{ st=await h.requestPermission({mode:'readwrite'}); }catch(e){ return; }
  if(st!=='granted'){ BUH.askState=st; buhRender(); return; }
  await buhAttach(h); }
// Перечитать файл. auto — само (раз в 5 с, возврат на вкладку): перерисовка только если что-то изменилось, и не под рукой у человека
async function buhReload(auto){ if(!BUH.h) return; const was=auto?JSON.stringify([BUH.file,BUH.bad]):'', r=await buhRead(BUH.h);
  if(r.ok){ BUH.bad=''; BUH.disk=r.file; BUH.file=marksMerge(marksMerge(r.file,BUH.file),r.copies.file);
    if(buhUnsavedN()||r.copies.names.length) await buhWrite({quiet:true}); }   // незаписанное (запись падала) или копии в папке — дописать в основной сразу
  else if(r.err==='PERM'){ BUH.ask=BUH.h; BUH.askState='prompt'; BUH.h=null; } else BUH.bad=r.err;
  ageRender();
  if(auto&&JSON.stringify([BUH.file,BUH.bad])===was&&BUH.h) return;
  if(auto&&buhBusy()){ BUH.pend=true; return; }
  BUH.pend=false; renderTab(); buhRender(); }
// Человек что-то делает: открыто окно или палитра, фокус в списке или в поле таблицы — не перерисовывать
function buhBusy(){ const a=document.activeElement;
  return !$('dlg').classList.contains('hide')||!$('pal').classList.contains('hide')||!!NOTE_ED||!!(a&&(a.tagName==='SELECT'||(a.matches&&a.matches(XL_SEL)))); }
function buhAuto(){ if(!SNAP||document.hidden) return;
  if(BUH.pend&&!buhBusy()){ BUH.pend=false; renderTab(); buhRender(); }
  if(BUH.h&&!buhBusy()) buhReload(true); }
// Запись: перечитать файл (и копии) → слить со своим → записать, только если что-то изменилось → копии в «старые_копии». По одной за раз.
function buhWrite(opt){ const go=()=>_buhWriteNow(opt); BUH.q=BUH.q.then(go,go); return BUH.q; }
async function _buhWriteNow(opt){ const quiet=!!(opt&&opt.quiet);   // quiet — дозапись при перечитывании: без окна, видно в полосе статуса
  const h=BUH.h; if(!BUH.file) return false;
  if(!h||BUH.bad){ renderTab(); buhRender(); if(!quiet) say('Пометка не сохранена',BUH.bad?BUH_BAD[BUH.bad](BUH.name):'Нет доступа к папке бухгалтерии. На вкладке «Счёт-фактуры» нажмите «🔓 Разрешить доступ» или подключите папку — пометка запишется сама.'); return false; }
  const r=await buhRead(h); if(!r.ok){ buhFail(r.err,quiet); return false; }
  const merged=marksMerge(marksMerge(r.file,BUH.file),r.copies.file);
  if(marksNeedWrite(r.file,merged)){ merged.savedAt=new Date().toISOString();
    try{ const fh=await h.getFileHandle(BUH_FILE,{create:true}); const w=await fh.createWritable(); await w.write(JSON.stringify(merged,null,1)); await w.close(); }
    catch(e){ buhFail(_permErr(e)?'PERM':'IO',quiet); return false; }
    BUH.disk=merged; const d=new Date(); BUH.saved=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  else BUH.disk=r.file;
  BUH.file=marksMerge(BUH.disk,BUH.file);
  await buhCopiesAway(h,r.copies.names);   // содержимое копий уже в основном файле
  ageRender(); buhRender(); return true;
}
function buhFail(err,quiet){ const n=BUH.name;
  if(err==='PERM'){ BUH.ask=BUH.h; BUH.askState='prompt'; BUH.h=null; } else BUH.bad=err;
  renderTab(); buhRender(); if(quiet) return;
  say('Пометка не сохранена',err==='PERM'?'Браузер забрал разрешение на папку «'+n+'». На вкладке «Счёт-фактуры» нажмите «🔓 Разрешить доступ» и отметьте ещё раз.':BUH_BAD[err](n)); }
function buhRender(){ const el=$('buh-st'); if(!el) return; let cls='', h;
  const b=(t,ti,fn,main)=>'<button class="btn'+(main?' btn-main':'')+'" type="button" title="'+ti+'" onclick="'+fn+'">'+t+'</button>';
  if(!buhCan()){ cls='ask'; h='<p>Отмечать с/ф в этом браузере нельзя: он не умеет сохранять файл в папку на диске (так на iPhone, iPad и в Safari). Смотреть отгрузки можно и здесь. Для пометок откройте эту же ссылку на компьютере в Google Chrome или Microsoft Edge.</p>'; }

// ===== Вкладка «Счёт-фактуры» (до 2026-10-05 — «По объектам»): дерево Покупатель ▶ проект · договор ▶ отгруженное (sfTree); отгружено / в с/ф / осталось внести =====
let OBJ_ROWS=[];
const SEL=new Set(), GCLOSED=new Set();
const selKey=r=>r.objKey+'\n'+r.ctr+'\n'+r.ART;   // строка дерева: проект + договор + артикул
const objCk=r=>'obj|'+r.objKey+'|'+r.ART;
const sfFlat=t=>[].concat(...t.map(c=>[].concat(...c.contracts.map(k=>k.rows))));
// Шапка (владелец 2026-10-05, без объектов — 2026-10-06): Покупатель → Номер договора (sfLists); списки пересобираются из дерева, выбранное сохраняется, если оно ещё есть
function objProjSelect(){ if(SNAP) objSelects(sfTree(SNAP,buhMarks())); }
function _opts(first,list,cur){ return '<option value="">'+first+'</option>'+list.map(x=>'<option value="'+esc(x.v)+'"'+(x.v===cur?' selected':'')+'>'+esc(x.label)+'</option>').join(''); }
function objSelects(T){
  const sc=$('o-cust'), sk=$('o-ctr'), L0=sfLists(T,'');
  const cu=L0.customers.some(x=>x.v===sc.value)?sc.value:''; sc.innerHTML=_opts('Все покупатели',L0.customers,cu); sc.value=cu;
  const L=sfLists(T,cu), kv=L.contracts.some(x=>x.v===sk.value)?sk.value:''; sk.innerHTML=_opts(cu?'Все договоры покупателя':'Все договоры',L.contracts,kv); sk.value=kv; }
function objFilter(){ return {customer:$('o-cust').value,contract:$('o-ctr').value}; }
function grpToggle(el){ const g=el.dataset.g; GCLOSED.has(g)?GCLOSED.delete(g):GCLOSED.add(g); renderObj(); }
function renderObj(){
  if(!SNAP) return; buhRender();
  const T1=sfTree(SNAP,buhMarks()); objSelects(T1);
  const on=buhOn(), f=objFilter(), q=$('q-obj').value, ql=_vLow(q).trim(), qa=_vArt(q), fc=$('fc-obj').value;
  const ok=r=>(!ql||(!!qa&&_vArt(r.article).includes(qa))||_vLow(r.name).includes(ql))&&colMatch(objCk(r),fc);
  const flat=sfFlat;
  const T0=sfFilter(T1,f), all=flat(T0);
  f.projects=f.customer||f.contract?new Set([].concat(...T0.map(c=>c.contracts.map(k=>k.project)))):null;   // пометки с/ф — по проектам выбранного
  const tree=T0.map(c=>({customer:c.customer,contracts:c.contracts.map(k=>Object.assign({},k,{rows:k.rows.filter(ok)})).filter(k=>k.rows.length)})).filter(c=>c.contracts.length);
  const rows=flat(tree);
  OBJ_ROWS=rows;
  $('c-obj').textContent=rows.length===all.length?'строк: '+all.length:'найдено '+rows.length+' из '+all.length;
  selBar();
  const N=[{k:'num',head:'Отгружено'},{k:'num',head:'В с/ф'},{k:'num',head:'Осталось внести'}];
  const sum=l=>l.reduce((t,r)=>(t[0]+=r.shipped,t[1]+=r.inSf,t[2]+=r.left,t),[0,0,0]);
  const nums=s=>cell(N[0],s[0])+cell(N[1],s[1],'sf')+cell(N[2],s[2]);
  if(!rows.length){ $('tb-obj').innerHTML='<tbody><tr><td class="empty">'+(all.length?'Ничего не найдено':'Отгрузок пока нет')+'</td></tr></tbody>'; }
  else {
    const lead=on?2:1;
    const head='<thead><tr>'+(on?'<th class="sel" title="Выбрать строку для отметки в с/ф">✓</th>':'')+'<th class="cc" title="Цветная пометка строки">●</th>'+WHO_TH+'<th>Артикул</th><th>Наименование</th>'
      +'<th class="n" title="Накладные «Н» минус возвраты «В»; брак «Р» не считается">Отгружено</th><th class="n" title="Сколько уже отмечено в с/ф">В с/ф</th><th class="n" title="Отгружено минус в с/ф">Осталось внести</th></tr></thead>';
    const row=r=>{ const i=OBJ_ROWS.indexOf(r), k=objCk(r);   // OBJ_ROWS — строки в порядке дерева (ставится до отрисовки строк)
      return '<tr'+colAttr(k,r.over?'over':'')+(r.over?' title="В с/ф больше, чем отгружено, на '+r.over+'"':'')+'>'
        +(on?'<td class="sel" data-h="Выбрать"><input type="checkbox" data-xr="'+i+'" data-xc="0"'+(SEL.has(selKey(r))?' checked':'')+' onchange="objSel('+i+',this.checked)" aria-label="Выбрать строку" title="Выбрать строку для отметки в с/ф"></td>':'')
        +ccell(k)+artCell(k,r.article)+'<td data-h="Наименование">'+esc(r.name)+(r.noShip?' <span class="tag ret">нет в отгрузке</span>':'')+'</td>'+nums([r.shipped,r.inSf,r.left])+'</tr>'; };
    let body='';
    const gh=(g,cls,label,sub,list,note)=>{ const c=GCLOSED.has(g);
      return '<tr class="grp '+cls+'" data-g="'+esc(g)+'" onclick="grpToggle(this)" title="'+(c?'Развернуть':'Свернуть')+': '+esc(label+(sub?' ('+sub+')':''))+'"><td colspan="'+(lead+3)+'" data-h=""><div class="gh"><span class="gl">'+(c?'▶ ':'▼ ')+esc(label)+(sub?'<span class="gsub">('+esc(sub)+')</span>':'')+'</span>'+(note||'')+'</div></td>'+nums(sum(list))+'</tr>'; };
    tree.forEach(cu=>{ const gc='c:'+cu.customer; body+=gh(gc,'g1',sfCustLabel(cu.customer),'',[].concat(...cu.contracts.map(k=>k.rows)));

async function sfSave(){
  SF.qty=SF.rows.map((r,i)=>$('sfq-'+i).value); SF.num=$('sf-num').value.trim(); SF.date=$('sf-date').value;

  if(over.length&&!(await ask('Больше, чем осталось внести',over.map(r=>overText(r)).join('\n')+'\n\nВсё равно отметить?','Да, всё равно отметить','Нет, исправить'))){ sfForm(''); return; }

  await buhWrite(); renderTab();
}

async function markEditSave(id){
  const m=buhMarks().find(x=>x.id===id&&!x.del); if(!m) return;
  const q=_int($('me-q').value), num=$('me-num').value.trim(), date=$('me-date').value;
  if(isNaN(q)||q<1){ markEdit(id,'Количество — целое число от 1. Чтобы убрать пометку, нажмите ✕ в списке.'); return; }
  const r=_markRow(m);
  if(r&&q>r.shipped-(r.inSf-(+m.qty||0))&&!(await ask('Больше, чем осталось внести',overText(r,+m.qty||0)+'\n\nВсё равно сохранить '+q+'?','Да, всё равно сохранить','Нет, исправить'))){ markEdit(id); return; }
  const m2=buhMarks().find(x=>x.id===id&&!x.del);   // за время вопроса файл могли перечитать
  if(!m2){ dlgClose(false); say('Пометки уже нет','Эту пометку удалили (возможно, на другом компьютере).'); renderTab(); return; }
  if(!buhMine(m2.who,WHO)){ dlgClose(false); markNotMine(m2); return; }
  Object.assign(m2,{qty:q,ts:Date.now()}); if(!m2.who&&WHO) m2.who=WHO; if(num) m2.num=num; else delete m2.num; if(date) m2.date=date; else delete m2.date;

}
async function markDel(id){

}
